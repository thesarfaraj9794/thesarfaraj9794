<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05010F"/>
      <stop offset="0.6" stop-color="#140630"/>
      <stop offset="1" stop-color="#2A0A4A"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="0.5" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4B5FD">
        <animate attributeName="stop-color" values="#C4B5FD;#F472B6;#FBBF24;#C4B5FD" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#F472B6">
        <animate attributeName="stop-color" values="#F472B6;#FBBF24;#C4B5FD;#F472B6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EC4899"/><stop offset="1" stop-color="#9D174D"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05010F" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#05010F" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="400" rx="26"/></clipPath>
    <clipPath id="ground"><rect x="0" y="270" width="1200" height="130"/></clipPath>
    <clipPath id="sunclip"><circle cx="930" cy="200" r="110"/></clipPath>
  </defs>

  <style>
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
    .star{animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    .rise{opacity:0;animation:up 1s ease forwards}
    @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .bob{animation:bob 4s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    .bob2{animation:bob 5s ease-in-out infinite;animation-delay:-2s}
    .grid{animation:run 1.2s linear infinite}
    @keyframes run{from{transform:translateY(0)}to{transform:translateY(16px)}}
    .blink{animation:bl 1s steps(1) infinite}
    @keyframes bl{50%{opacity:0}}
    .pulse{animation:pu 1.8s ease-out infinite;transform-origin:center;transform-box:fill-box}
    @keyframes pu{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
    .shadow{animation:sh 4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
    @keyframes sh{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(.75);opacity:.25}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#sky)"/>

    <g fill="#EDE9FE">
      <circle class="star" cx="40" cy="30" r="1.5"/>
      <circle class="star" cx="150" cy="70" r="1.1" style="animation-delay:.6s"/>
      <circle class="star" cx="300" cy="22" r="1.4" style="animation-delay:1.2s"/>
      <circle class="star" cx="470" cy="50" r="1.2" style="animation-delay:.3s"/>
      <circle class="star" cx="620" cy="28" r="1.7" style="animation-delay:1.8s"/>
      <circle class="star" cx="720" cy="80" r="1.1" style="animation-delay:.9s"/>
      <circle class="star" cx="1110" cy="36" r="1.6" style="animation-delay:1.5s"/>
      <circle class="star" cx="1170" cy="110" r="1.2" style="animation-delay:.2s"/>
      <circle class="star" cx="560" cy="120" r="1.2" style="animation-delay:2.2s"/>
      <circle class="star" cx="760" cy="160" r="1.3" style="animation-delay:1.1s"/>
      <circle class="star" cx="1080" cy="190" r="1" style="animation-delay:2.6s"/>
    </g>

    <circle cx="930" cy="200" r="190" fill="url(#glow)"/>
    <g clip-path="url(#sunclip)">
      <rect x="820" y="90" width="220" height="220" fill="url(#sun)"/>
      <g fill="#140630">
        <rect x="820" y="215" width="220" height="5"><animate attributeName="y" values="215;205;215" dur="3s" repeatCount="indefinite"/></rect>
        <rect x="820" y="235" width="220" height="8"><animate attributeName="y" values="235;225;235" dur="3s" repeatCount="indefinite"/></rect>
        <rect x="820" y="257" width="220" height="11"><animate attributeName="y" values="257;247;257" dur="3s" repeatCount="indefinite"/></rect>
        <rect x="820" y="282" width="220" height="14"/>
      </g>
    </g>

    <rect x="0" y="270" width="1200" height="130" fill="#0B0320"/>
    <g clip-path="url(#ground)" stroke="url(#floor)" stroke-width="1.4" fill="none">
      <g class="grid">
        <line x1="0" y1="258" x2="1200" y2="258"/>
        <line x1="0" y1="274" x2="1200" y2="274"/>
        <line x1="0" y1="290" x2="1200" y2="290"/>
        <line x1="0" y1="306" x2="1200" y2="306"/>
        <line x1="0" y1="322" x2="1200" y2="322"/>
        <line x1="0" y1="338" x2="1200" y2="338"/>
        <line x1="0" y1="354" x2="1200" y2="354"/>
        <line x1="0" y1="370" x2="1200" y2="370"/>
        <line x1="0" y1="386" x2="1200" y2="386"/>
        <line x1="0" y1="402" x2="1200" y2="402"/>
      </g>
      <g>
        <line x1="930" y1="270" x2="-600" y2="400"/>
        <line x1="930" y1="270" x2="-200" y2="400"/>
        <line x1="930" y1="270" x2="150" y2="400"/>
        <line x1="930" y1="270" x2="450" y2="400"/>
        <line x1="930" y1="270" x2="720" y2="400"/>
        <line x1="930" y1="270" x2="930" y2="400"/>
        <line x1="930" y1="270" x2="1140" y2="400"/>
        <line x1="930" y1="270" x2="1410" y2="400"/>
        <line x1="930" y1="270" x2="1710" y2="400"/>
      </g>
    </g>
    <rect x="0" y="270" width="1200" height="130" fill="url(#fade)"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#F472B6" stroke-width="2" opacity="0.8"/>

    <ellipse class="shadow" cx="930" cy="318" rx="70" ry="12" fill="#000"/>

    <path d="M820 205 A110 30 0 0 1 1040 205" fill="none" stroke="#FBBF24" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="6 6"/>

    <g class="bob">
      <polygon points="930,140 990,175 930,210 870,175" fill="url(#top)"/>
      <polygon points="870,175 930,210 930,280 870,245" fill="url(#left)"/>
      <polygon points="990,175 930,210 930,280 990,245" fill="url(#right)"/>
      <polyline points="870,175 930,140 990,175" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5"/>
      <line x1="930" y1="210" x2="930" y2="280" stroke="#FFFFFF" stroke-opacity="0.35"/>
      <text x="900" y="236" class="mono" font-size="20" font-weight="700" fill="#EDE9FE" transform="matrix(1 0.583 0 1 0 -524.7)" opacity="0.9">&lt;/&gt;</text>
      <circle cx="958" cy="230" r="9" fill="none" stroke="#FCE7F3" stroke-width="2"><animate attributeName="r" values="7;11;7" dur="2s" repeatCount="indefinite"/></circle>
      <polygon points="930,158 958,175 930,192 902,175" fill="#FFFFFF" opacity="0.15">
        <animate attributeName="opacity" values="0.05;0.35;0.05" dur="3s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <path d="M820 205 A110 30 0 0 0 1040 205" fill="none" stroke="#FBBF24" stroke-opacity="0.9" stroke-width="2"/>
    <circle r="7" fill="#FBBF24">
      <animateMotion dur="6s" repeatCount="indefinite" path="M1040 205 A110 30 0 0 1 820 205 A110 30 0 0 1 1040 205"/>
    </circle>

    <g class="sans" font-size="13" font-weight="700">
      <g transform="translate(700 110)"><g class="bob2">
        <rect x="5" y="5" width="96" height="30" rx="9" fill="#2E1065"/>
        <rect width="96" height="30" rx="9" fill="#1E0B45" stroke="#A78BFA"/>
        <text x="48" y="20" text-anchor="middle" fill="#DDD6FE">Flutter</text>
      </g></g>
      <g transform="translate(1060 90)"><g class="bob" style="animation-delay:-1s">
        <rect x="5" y="5" width="112" height="30" rx="9" fill="#500724"/>
        <rect width="112" height="30" rx="9" fill="#1E0B45" stroke="#F472B6"/>
        <text x="56" y="20" text-anchor="middle" fill="#FBCFE8">React Native</text>
      </g></g>
      <g transform="translate(720 210)"><g class="bob" style="animation-delay:-2.5s">
        <rect x="5" y="5" width="88" height="30" rx="9" fill="#451A03"/>
        <rect width="88" height="30" rx="9" fill="#1E0B45" stroke="#FBBF24"/>
        <text x="44" y="20" text-anchor="middle" fill="#FDE68A">Next.js</text>
      </g></g>
      <g transform="translate(1070 220)"><g class="bob2" style="animation-delay:-3s">
        <rect x="5" y="5" width="96" height="30" rx="9" fill="#451A03"/>
        <rect width="96" height="30" rx="9" fill="#1E0B45" stroke="#FBBF24"/>
        <text x="48" y="20" text-anchor="middle" fill="#FDE68A">Firebase</text>
      </g></g>
      <g transform="translate(1075 150)"><g class="bob" style="animation-delay:-.5s">
        <rect x="5" y="5" width="100" height="30" rx="9" fill="#052E16"/>
        <rect width="100" height="30" rx="9" fill="#1E0B45" stroke="#34D399"/>
        <text x="50" y="20" text-anchor="middle" fill="#A7F3D0">Supabase</text>
      </g></g>
    </g>

    <g class="rise" style="animation-delay:.1s">
      <text x="70" y="92" class="mono" font-size="20" fill="#F472B6">&gt; hello world, I'm<tspan class="blink" fill="#FBBF24"> _</tspan></text>
    </g>
    <g class="rise" style="animation-delay:.4s">
      <g class="sans" font-size="64" font-weight="900" letter-spacing="2">
        <text x="76" y="174" fill="#2E1065">SARFARAZ ALAM</text>
        <text x="74" y="172" fill="#3B0F6E">SARFARAZ ALAM</text>
        <text x="72" y="170" fill="#4C1D95">SARFARAZ ALAM</text>
        <text x="70" y="168" fill="#5B21B6">SARFARAZ ALAM</text>
        <text x="66" y="164" fill="url(#name)">SARFARAZ ALAM</text>
      </g>
    </g>
    <g class="rise" style="animation-delay:.7s">
      <text x="68" y="208" class="sans" font-size="25" font-weight="700" fill="#EDE9FE">Cross-Platform App Developer</text>
    </g>
    <g class="rise" style="animation-delay:1s">
      <text x="68" y="240" class="mono" font-size="15" fill="#B9B4D6">Android · iOS · Web — Flutter · React Native · Next.js</text>
    </g>
    <g class="rise" style="animation-delay:1.3s">
      <rect x="68" y="300" width="300" height="36" rx="18" fill="#052E16" fill-opacity="0.8" stroke="#22C55E" stroke-opacity="0.7"/>
      <circle cx="91" cy="318" r="5" fill="#22C55E" class="pulse"/>
      <circle cx="91" cy="318" r="5" fill="#22C55E"/>
      <text x="105" y="323" class="sans" font-size="14" font-weight="700" fill="#BBF7D0">Open for freelance &amp; full-time</text>
    </g>
  </g>
</svg>
