<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210">
  <defs>
    <linearGradient id="ln" x1="0" x2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
    .dash{stroke-dasharray:8 8;animation:mv 1s linear infinite}
    @keyframes mv{to{stroke-dashoffset:-16}}
    .ring{animation:pu 4s ease-out infinite;transform-origin:center;transform-box:fill-box;opacity:0}
    @keyframes pu{0%{transform:scale(1);opacity:.9}25%{transform:scale(1.6);opacity:0}100%{opacity:0}}
  </style>
  <rect width="1000" height="210" rx="20" fill="#0B0320"/>
  <line x1="125" y1="80" x2="875" y2="80" stroke="#2E1065" stroke-width="4"/>
  <line x1="125" y1="80" x2="875" y2="80" stroke="url(#ln)" stroke-width="3" class="dash"/>
  <circle r="7" fill="#FFFFFF">
    <animateMotion path="M125 80 H875" dur="4s" repeatCount="indefinite"/>
  </circle>
  <g class="sans">
    <circle cx="125" cy="80" r="34" fill="none" stroke="#7C3AED" stroke-width="3" class="ring" style="animation-delay:0s"/>
    <circle cx="125" cy="80" r="34" fill="#1E0B45" stroke="#7C3AED" stroke-width="3"/>
    <text x="125" y="88" text-anchor="middle" class="mono" font-size="22" font-weight="700" fill="#C4B5FD">01</text>
    <text x="125" y="146" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Design</text>
    <text x="125" y="172" text-anchor="middle" font-size="13" fill="#A1A1C2">Figma · UI/UX</text>

    <circle cx="375" cy="80" r="34" fill="none" stroke="#A855F7" stroke-width="3" class="ring" style="animation-delay:1s"/>
    <circle cx="375" cy="80" r="34" fill="#1E0B45" stroke="#A855F7" stroke-width="3"/>
    <text x="375" y="88" text-anchor="middle" class="mono" font-size="22" font-weight="700" fill="#E9D5FF">02</text>
    <text x="375" y="146" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Build</text>
    <text x="375" y="172" text-anchor="middle" font-size="13" fill="#A1A1C2">Flutter · React Native · Next.js</text>

    <circle cx="625" cy="80" r="34" fill="none" stroke="#F472B6" stroke-width="3" class="ring" style="animation-delay:2s"/>
    <circle cx="625" cy="80" r="34" fill="#1E0B45" stroke="#F472B6" stroke-width="3"/>
    <text x="625" y="88" text-anchor="middle" class="mono" font-size="22" font-weight="700" fill="#FBCFE8">03</text>
    <text x="625" y="146" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Integrate &amp; Test</text>
    <text x="625" y="172" text-anchor="middle" font-size="13" fill="#A1A1C2">REST APIs · Postman</text>

    <circle cx="875" cy="80" r="34" fill="none" stroke="#F59E0B" stroke-width="3" class="ring" style="animation-delay:3s"/>
    <circle cx="875" cy="80" r="34" fill="#1E0B45" stroke="#F59E0B" stroke-width="3"/>
    <text x="875" y="88" text-anchor="middle" class="mono" font-size="22" font-weight="700" fill="#FDE68A">04</text>
    <text x="875" y="146" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Deploy</text>
    <text x="875" y="172" text-anchor="middle" font-size="13" fill="#A1A1C2">Firebase Hosting · GoDaddy</text>
  </g>
</svg>
